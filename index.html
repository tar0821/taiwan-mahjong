<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台麻十六張</title>
<meta name="description" content="台灣十六張麻將，開房傳連結給朋友，四人或兩人線上一起打，也可以跟電腦打。">
<meta name="theme-color" content="#071a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台麻">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'%3E%3Crect x='1' y='1' width='28' height='38' rx='5' fill='%23f4eedb' stroke='%232a9cc2' stroke-width='2'/%3E%3Ctext x='15' y='28' font-size='20' text-anchor='middle' fill='%23b8322a' font-weight='900'%3E中%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: one-screen table — board scrolls, the dock (actions + your hand) stays pinned at the bottom.
   Single deliberate look: green felt table, ivory tiles, brass accents. */
:root{
  color-scheme: dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --felt:#0d2f3a; --felt-hi:#164452; --rail:#071a22; --line:#2a5866;
  --ivory:#f4eedb; --ivory-sh:#d9cfb2; --jade:#2a9cc2; --ink:#211d16;
  --red:#b8322a; --blue:#1d4c8c; --green:#1f6e43;
  --brass:#d8b25a; --brass-dim:#a98a45;
  --text:#e8f2f4; --muted:#9bb8c0; --win:#e8524a;
  --f-tile:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --tw:20px;
}
html,body{height:100%}
html{box-sizing:border-box;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--rail);color:var(--text);font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 50% 35%,var(--felt-hi),var(--felt) 60%,var(--rail));background-attachment:fixed}
#app{--AW:100vw;--AH:100vh;--hw:clamp(22px,min(calc((var(--AW) - 40px)/var(--u,17.5)),calc(var(--AH)*.15)),70px);height:100%;display:flex;flex-direction:column;max-width:1400px;margin:0 auto}
@supports (height:100dvh){#app{--AW:100dvw;--AH:100dvh}}
#app{--hw:clamp(22px,min(calc((var(--AW) - 40px)/var(--u,17.5)),calc(var(--AH)*.15)),70px)}
/* 手機直拿時把整個畫面轉成橫的 */
@media (orientation:portrait){
  body{overflow:hidden}
  #app{position:fixed;top:0;left:100%;width:var(--AW);height:var(--AH);transform-origin:top left;transform:rotate(90deg);max-width:none;margin:0;
    --AW:100vh;--AH:100vw;box-sizing:border-box;
    padding-left:max(12px,env(safe-area-inset-top,0px));padding-right:max(12px,env(safe-area-inset-bottom,0px));
    background:var(--rail);background-image:radial-gradient(ellipse at 50% 35%,var(--felt-hi),var(--felt) 60%,var(--rail))}
  @supports (height:100dvh){#app{--AW:100dvh;--AH:100dvw}}
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{font:inherit}
.muted{color:var(--muted)}

/* ---------- tiles ---------- */
.t{--w:var(--tw);width:var(--w);height:calc(var(--w)*1.38);flex:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fffaf0,var(--ivory) 55%,#e8dfc4);border-radius:calc(var(--w)*.13);
  box-shadow:inset 0 0 0 1px rgba(120,100,60,.25),inset 0 -2px 0 var(--ivory-sh),0 calc(var(--w)*.13) 0 var(--jade),0 calc(var(--w)*.13) 0 1px #1d5a3d,0 calc(var(--w)*.16) 4px rgba(0,0,0,.4);
  font-family:var(--f-tile);font-weight:900;line-height:1;color:var(--ink);user-select:none;position:relative}
.t.pic svg{width:84%;height:84%;display:block}
.t b{font-size:calc(var(--w)*.56);font-weight:900}
.t i{font-style:normal;font-size:calc(var(--w)*.5);margin-top:calc(var(--w)*.04);font-weight:900}
.t.wan i{color:var(--red)} .t.wan b{color:var(--ink)}
.t.tong b,.t.tong i{color:var(--blue)}
.t.tiao b,.t.tiao i{color:var(--green)}
.t.f b{font-size:calc(var(--w)*.66);color:var(--ink)}
.t.zh b{font-size:calc(var(--w)*.66);color:var(--red)}
.t.fa b{font-size:calc(var(--w)*.66);color:var(--green)}
.t.bai::after{content:"";position:absolute;inset:22% 18%;border:calc(var(--w)*.07) solid var(--blue);border-radius:2px}
.t.fl1 b{color:var(--red);font-size:calc(var(--w)*.56)} .t.fl2 b{color:var(--green);font-size:calc(var(--w)*.56)}
.t.fl1 i,.t.fl2 i{font-size:calc(var(--w)*.32);color:var(--ink)}
.t.back{background:linear-gradient(160deg,#6fd0e8,#2a97bc);box-shadow:0 calc(var(--w)*.09) 0 #1a6c88}
.t.hl{box-shadow:inset 0 0 0 2px var(--brass),0 calc(var(--w)*.13) 0 var(--jade),0 0 8px rgba(216,178,90,.7)}
.tiles{display:flex;flex-wrap:wrap;gap:2px 2px}
.meld{display:inline-flex;gap:1px;margin-right:5px}

/* ---------- home ---------- */
.home{flex:1;overflow-y:auto;padding-block:20px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-content:start;max-width:900px;width:100%;margin:0 auto}
.home .brand,.home > .note{grid-column:1/-1}
.brand{display:flex;flex-direction:column;gap:10px}
.brand h1{font-family:var(--f-tile);font-weight:900;font-size:44px;letter-spacing:.06em;margin:0;line-height:1.05;text-wrap:balance}
.brand h1 span{color:var(--brass)}
.brand p{margin:0;color:var(--muted);line-height:1.6}
.deco{display:flex;gap:4px;--tw:30px}
.panel{background:rgba(4,22,18,.5);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:16px;font-weight:700;letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.inp{background:var(--rail);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .field{flex:1;min-width:90px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:10px 14px}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--ink);font-weight:700}
.btn{background:var(--brass);color:var(--ink);border:0;border-radius:8px;padding:11px 16px;font-weight:700;letter-spacing:.04em}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.small{padding:7px 12px;font-size:13px}
.tables{display:flex;flex-direction:column;gap:8px}
.tablecard{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tablecard .grow{flex:1;min-width:0}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.18em;font-weight:700;color:var(--brass)}
.note{font-size:13px;color:var(--muted);line-height:1.65}
.warn{font-size:13px;color:var(--brass);line-height:1.6}

/* ---------- table (always landscape) ---------- */
.board{flex:1;min-height:0;display:grid;grid-template-columns:clamp(84px,13%,170px) 1fr clamp(84px,13%,170px);gap:6px;padding-top:4px;align-items:center}
.board.two{grid-template-columns:1fr}
.feltwrap{position:relative;height:100%;min-width:0}
.felt{--tw:clamp(10px,calc(var(--AH)*.036),22px);--th:calc(var(--tw)*1.38);--gap:calc(var(--tw)*3.6);
  position:absolute;inset:calc(var(--tw)*1.6) 4px 4px;border-radius:28px;
  background:radial-gradient(ellipse at 50% 42%,#2c5873,#1e3f56 55%,#152d3e);
  border:calc(var(--tw)*.75) solid #7a4424;
  box-shadow:inset 0 0 0 2px #d8a84e,inset 0 0 0 4px #4a2610,inset 0 10px 26px rgba(0,0,0,.45),0 0 0 2px #a8682f,0 0 0 5px #3c1e0b,0 16px 32px rgba(0,0,0,.6);
  transform:perspective(1200px) rotateX(14deg);transform-origin:50% 100%}
.felt .t{box-shadow:inset 0 0 0 1px rgba(120,100,60,.25),0 calc(var(--w)*.12) 0 var(--jade),0 calc(var(--w)*.14) 2px rgba(0,0,0,.35)}
.felt .t.hl{box-shadow:inset 0 0 0 2px var(--brass),0 calc(var(--w)*.12) 0 var(--jade),0 0 10px 2px rgba(255,214,110,.8)}
.compass{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--gap)*2 - var(--tw)*.7);height:calc(var(--gap)*2 - var(--tw)*.7);
  border-radius:16px;background:rgba(6,20,30,.55);border:1px solid rgba(120,200,230,.35);box-shadow:inset 0 0 18px rgba(0,0,0,.35);display:grid;place-items:center}
.compass .w{position:absolute;font-family:var(--f-tile);font-weight:900;font-size:calc(var(--tw)*1.05);color:rgba(220,240,244,.55)}
.compass .w.on{color:var(--brass);text-shadow:0 0 10px rgba(216,178,90,.8)}
.compass .w.pb{bottom:4px;left:50%;transform:translateX(-50%)}.compass .w.pt{top:4px;left:50%;transform:translateX(-50%) rotate(180deg)}
.compass .w.pl{left:6px;top:50%;transform:translateY(-50%) rotate(90deg)}.compass .w.pr{right:6px;top:50%;transform:translateY(-50%) rotate(-90deg)}
.compass .left{font-variant-numeric:tabular-nums;font-size:calc(var(--tw)*1.5);font-weight:700;line-height:1;text-align:center}
.compass .left small{display:block;font-size:calc(var(--tw)*.6);color:rgba(220,240,244,.65);font-weight:400;margin-top:2px}
.compass .tmr{display:block;font-size:calc(var(--tw)*.85);margin-top:2px;min-height:1em}
.rv{position:absolute;display:flex;flex-wrap:wrap;gap:1px;width:calc(var(--tw)*8 + 7px)}
.rv-b{left:50%;top:calc(50% + var(--gap));transform:translateX(-50%)}
.rv-t{left:50%;bottom:calc(50% + var(--gap));transform:translateX(-50%);flex-wrap:wrap-reverse;flex-direction:row-reverse}
.rv.wide{width:calc(var(--tw)*13 + 12px)}
.rv-l,.rv-r{display:grid;width:auto;grid-template-rows:repeat(5,var(--th));grid-auto-flow:column;grid-auto-columns:var(--tw);gap:1px;top:50%;transform:translateY(-50%)}
.rv-l{right:calc(50% + var(--gap));direction:rtl}
.rv-r{left:calc(50% + var(--gap))}
.edge{position:absolute;transform:translate(-50%,-50%) rotate(var(--a))}
.e-top{left:50%;top:calc(var(--th)/2 + 5px)}
.e-left{left:calc(var(--th)/2 + 5px);top:50%}
.e-right{left:calc(100% - var(--th)/2 - 5px);top:50%}
.hb{display:flex;gap:1px;flex-wrap:nowrap}
.t.back{background:linear-gradient(160deg,#6fd0e8,#2a97bc);box-shadow:0 calc(var(--w)*.1) 0 #1a6c88}
.t.back.stand{background:linear-gradient(180deg,#fbf6e6 0 18%,#c9bf9f 18% 22%,#62c7e2 22%,#2a8fb4)}
.felt .t.back.stand{box-shadow:0 calc(var(--w)*.1) 0 #155a73,0 calc(var(--w)*.14) 3px rgba(0,0,0,.35)}

.hud{--tw:13px;position:relative;background:rgba(3,18,24,.55);border:1px solid transparent;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.hud.on{border-color:var(--brass);box-shadow:0 0 12px rgba(216,178,90,.35)}
.hud-t{position:absolute;top:0;left:6px;z-index:2;max-width:38%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:4px 8px}
.hud-t .hudtiles{width:100%}
.who{display:flex;align-items:center;gap:5px;font-size:12px;min-width:0}
.who .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px}
.wind{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rail);border:1px solid var(--brass-dim);font-family:var(--f-tile);font-weight:900;font-size:12px;color:var(--brass);flex:none}
.wind.dl{background:var(--brass);color:var(--ink)}
.sc{font-variant-numeric:tabular-nums;color:var(--text);font-weight:700}
.sc.neg{color:#f29b8f}
.badge{font-size:11px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.zh{border-color:var(--brass-dim);color:var(--brass)}
.badge.off{border-color:#7a4b40;color:#f29b8f}
.cnt{font-size:11px;color:var(--muted)}
.hudtiles{gap:1px}
.meld{display:inline-flex;gap:0;margin-right:4px}
.topinfo{position:absolute;top:0;right:6px;z-index:2;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap;background:rgba(3,18,24,.55);border-radius:99px;padding:3px 4px 3px 12px;max-width:58%;overflow:hidden}
.topinfo .btn.small{padding:4px 10px;font-size:12px}
.tmr{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:700}
.prompt{position:absolute;left:50%;bottom:calc(var(--hw)*.42 + 10px);transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:rgba(3,18,24,.72);border-radius:16px;padding:6px 14px;max-width:calc(100% - 16px);width:max-content;pointer-events:none}
.prompt.live{background:rgba(3,18,24,.9);border:1px solid var(--brass-dim);padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto}
.prompt .hint{font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;--tw:15px;text-align:center}
.prompt .bigt{--tw:30px;display:inline-flex}
.prompt .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.prompt .ab{font-size:18px;padding:9px 18px;--tw:24px;border-radius:12px;min-height:46px}
.prompt .ab.win{font-size:22px;padding:9px 30px}
.prompt .ab.ghost{min-width:72px;justify-content:center}
.topinfo .lg{color:var(--text);overflow:hidden;text-overflow:ellipsis;min-width:0}
.ab{border:0;border-radius:9px;padding:6px 14px;font-weight:700;background:var(--ivory);color:var(--ink);display:inline-flex;align-items:center;gap:6px;--tw:15px}
.ab.win{background:var(--win);color:#fff;font-size:17px;padding:6px 22px;font-family:var(--f-tile);box-shadow:0 0 14px rgba(232,82,74,.6)}
.ab.pri{background:var(--brass)}
.ab.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}

.dock{flex:none;display:flex;flex-direction:column;gap:0;margin-top:calc(var(--hw)*-.42);position:relative;z-index:2}
.dockrow{display:flex;align-items:flex-end;gap:6px;justify-content:center}
.statusbar{display:flex;align-items:center;gap:8px;height:24px;margin-top:3px;padding:0 8px;background:linear-gradient(180deg,#0a1a24,#050e14);border:1px solid #1d3a4a;border-radius:6px;font-size:12px;white-space:nowrap;overflow:hidden}
.statusbar .wind{width:20px;height:20px;border-radius:4px;font-size:12px}
.statusbar .zhuang{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:#b8322a;color:#fff;font-weight:700;font-family:var(--f-tile)}
.statusbar .nm{font-weight:700}
.statusbar .cell{padding:1px 10px;border-left:1px solid #1d3a4a;color:var(--muted)}
.statusbar .sc{color:#ffd76a}
.dock.on .statusbar{border-color:var(--brass)}
.mymelds{--tw:calc(var(--hw)*.8);display:flex;align-items:flex-end;flex:none}
.myflowers{--tw:calc(var(--hw)*.58);display:flex;gap:1px;align-items:flex-end;flex:none}
.hud-me{flex:none;width:auto;max-width:96px;align-self:center}
.dock.on .hud-me{border-color:var(--brass)}
.hand{flex:none;min-width:0;--tw:var(--hw);display:flex;flex-wrap:nowrap;gap:2px;justify-content:center;padding-top:9px}
.hand .t{cursor:pointer;transition:transform .12s}
.hand .t.sel{transform:translateY(-9px);box-shadow:inset 0 0 0 2px var(--brass),0 calc(var(--w)*.13) 0 var(--jade),0 6px 10px rgba(0,0,0,.4)}
.hand .t.new{margin-left:8px}
.hand .t.dim{filter:brightness(.85)}
/* ---------- effects ---------- */
.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:calc(var(--AH)*.26);height:calc(var(--AH)*.26);max-width:170px;max-height:170px;border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle,rgba(8,18,28,.92) 58%,rgba(8,18,28,.6) 70%,transparent 72%);
  box-shadow:0 0 0 3px rgba(200,170,255,.55),0 0 24px 6px rgba(170,130,255,.55);animation:popin .22s ease-out;pointer-events:none}
.pop .t{--tw:calc(var(--AH)*.12)}
@keyframes popin{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.banner{position:absolute;left:50%;top:46%;z-index:6;transform:translate(-50%,-50%);display:flex;align-items:center;gap:14px;pointer-events:none;animation:bannerin 1.8s ease-out forwards}
.banner b{font-family:var(--f-tile);font-weight:900;font-size:calc(var(--AH)*.2);line-height:1;color:#fff;padding:.08em .35em;
  background:linear-gradient(90deg,transparent,#e8304a 18%,#ff5a6e 50%,#e8304a 82%,transparent);-webkit-text-stroke:3px #7a0f1f;paint-order:stroke fill;text-shadow:0 4px 0 #7a0f1f,0 0 22px rgba(255,90,110,.8)}
.banner.peng b,.banner.chi b,.banner.gang b{background:linear-gradient(90deg,transparent,#e88a1a 18%,#ffb43a 50%,#e88a1a 82%,transparent);-webkit-text-stroke:3px #6e3a05;text-shadow:0 4px 0 #6e3a05,0 0 22px rgba(255,180,60,.8)}
.banner .who{font-size:calc(var(--AH)*.05);font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:99px;white-space:nowrap}
.banner .fang{position:absolute;left:55%;top:85%;font-family:var(--f-tile);font-weight:900;font-size:calc(var(--AH)*.13);color:#fff;-webkit-text-stroke:3px #142a6a;paint-order:stroke fill;text-shadow:0 4px 0 #142a6a,0 0 18px rgba(80,140,255,.8);white-space:nowrap}
.banner .fang small{font-size:.35em;-webkit-text-stroke:0;margin-left:6px;text-shadow:none}
@keyframes bannerin{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}12%{transform:translate(-50%,-50%) scale(1);opacity:1}82%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.05);opacity:0}}
@media (prefers-reduced-motion:reduce){.banner,.pop{animation:none}}

/* ---------- 聽牌 ---------- */
.ab.ting{background:linear-gradient(180deg,#ffd76a,#e0a526);color:#3a2300;font-family:var(--f-tile);font-size:20px;padding:6px 26px;box-shadow:0 0 12px rgba(255,200,80,.6)}
.prompt .ab.ting{font-size:22px}
.hand .t.tingok{box-shadow:inset 0 0 0 2px #ffd76a,0 calc(var(--w)*.13) 0 var(--jade),0 0 10px 2px rgba(255,210,90,.75);transform:translateY(-4px)}
.tingbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;background:linear-gradient(180deg,#ffd76a,#e0a526);color:#3a2300;font-family:var(--f-tile);font-weight:900;font-size:12px;box-shadow:0 0 8px rgba(255,200,80,.6)}
.waits{position:absolute;left:8px;bottom:calc(var(--hw)*1.38 + 40px);z-index:3;display:flex;align-items:flex-end;gap:6px;background:rgba(5,14,22,.88);border:1px solid #c99a3a;border-radius:12px;padding:6px 10px;--tw:clamp(18px,calc(var(--AH)*.06),30px)}
.waits .lbl{align-self:center;font-family:var(--f-tile);font-weight:900;font-size:18px;color:#ffd76a}
.waits .w1{display:flex;flex-direction:column;align-items:center;gap:3px}
.waits em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- 動畫 ---------- */
#app.scr-in > *:not(.ov){animation:scrIn .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--se,0ms)}

<body>

<div id="app"></div>

<script>
/* ===== 台灣十六張麻將 規則引擎 ===== */
const DEAD = 16;            // 留尾 16 張
const TURN_MS = 30000;      // 出牌時限
const CLAIM_MS = 12000;     // 吃碰胡反應時限
const turnMs = G => G.mode === 2 ? 10000 : TURN_MS;   // 兩人麻將出牌 10 秒
const claimMs = G => G.mode === 2 ? 10000 : CLAIM_MS;
const AWAY_MS = 2500;       // 離線玩家自動處理
const NUMS = '一二三四五六七八九';
const WINDS = '東南西北';

function tileName(t) {
  if (t < 27) return NUMS[t % 9] + ['萬', '筒', '條'][Math.floor(t / 9)];
  if (t < 34) return '東南西北中發白'[t - 27];
  return '春夏秋冬梅蘭竹菊'[t - 34];
}
const enc = a => a.map(t => String.fromCharCode(48 + t)).join('');
const dec = s => (s ? [...s].map(c => c.charCodeAt(0) - 48) : []);
function cnt(arr) { const c = new Array(34).fill(0); for (const t of arr) if (t < 34) c[t]++; return c; }
const sortT = a => a.slice().sort((x, y) => x - y);
function removeOne(arr, t) { const i = arr.indexOf(t); if (i < 0) return false; arr.splice(i, 1); return true; }

function setsOk(c, n) {
  let i = 0; while (i < 34 && c[i] === 0) i++;
  if (i === 34) return n === 0;
  if (n === 0) return false;
  if (c[i] >= 3) { c[i] -= 3; const ok = setsOk(c, n - 1); c[i] += 3; if (ok) return true; }
  if (i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2]) {
    c[i]--; c[i + 1]--; c[i + 2]--; const ok = setsOk(c, n - 1); c[i]++; c[i + 1]++; c[i + 2]++; if (ok) return true;
  }
  return false;
}
function isWin(c, nSets) {
  let tot = 0; for (const x of c) tot += x;
  if (tot !== nSets * 3 + 2) return false;
  for (let i = 0; i < 34; i++) if (c[i] >= 2) { c[i] -= 2; const ok = setsOk(c, nSets); c[i] += 2; if (ok) return true; }
  return false;
}
function handWins(hand, melds) { return isWin(cnt(hand), 5 - melds.length); }
function waits(hand, melds) {
  const c = cnt(hand), out = [];
  for (let t = 0; t < 34; t++) { if (c[t] >= 4) continue; c[t]++; if (isWin(c, 5 - melds.length)) out.push(t); c[t]--; }
  return out;
}
function decomps(c) {
  const out = [];
  const rec = (acc, pair) => {
    let i = 0; while (i < 34 && c[i] === 0) i++;
    if (i === 34) { out.push({ pair, g: acc.slice() }); return; }
    if (c[i] >= 3) { c[i] -= 3; acc.push({ k: 'p', t: i }); rec(acc, pair); acc.pop(); c[i] += 3; }
    if (i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2]) {
      c[i]--; c[i + 1]--; c[i + 2]--; acc.push({ k: 'c', t: i }); rec(acc, pair); acc.pop(); c[i]++; c[i + 1]++; c[i + 2]++;
    }
  };
  for (let i = 0; i < 34; i++) if (c[i] >= 2) { c[i] -= 2; rec([], i); c[i] += 2; }
  return out;
}

/* ---------- seats ---------- */
function nextSeat(G, s) { const a = G.active; return a[(a.indexOf(s) + 1) % a.length]; }
function windOf(G, s) {
  const a = G.active, i = (a.indexOf(s) - a.indexOf(G.dealer) + a.length) % a.length;
  return a.length === 2 ? i * 2 : i;
}

/* ---------- 台數 ---------- */
function scoreHand(G, s, win, sd, ctx) {
  if (G.mode === 2) return score2(G, s, win, sd, ctx);
  const hand = G.hands[s].slice(); if (!sd) hand.push(win);
  const melds = G.melds[s], fl = G.flowers[s];
  const seatW = windOf(G, s), roundW = G.wind;
  const before = hand.slice(); removeOne(before, win);
  const single = waits(before, melds).length === 1;
  const menqing = melds.every(m => m.t === 'a');
  const allTiles = hand.concat(...melds.map(m => m.x));
  const suits = new Set(allTiles.filter(t => t < 27).map(t => Math.floor(t / 9)));
  const honors = allTiles.some(t => t >= 27);
  let best = null;
  for (const d of decomps(cnt(hand))) {
    const groups = d.g.map(g => ({ k: g.k, t: g.t, open: false }))
      .concat(melds.map(m => ({ k: m.t === 'c' ? 'c' : 'p', t: Math.min(...m.x), open: m.t !== 'a' })));
    let anke = d.g.filter(g => g.k === 'p').length + melds.filter(m => m.t === 'a').length;
    if (!sd) {
      const inPair = d.pair === win, inChow = d.g.some(g => g.k === 'c' && win >= g.t && win <= g.t + 2);
      if (!inPair && !inChow) anke--;
    }
    const it = []; const add = (n, v) => it.push([n, v]);
    if (ctx.heaven) add('天胡', 24);
    else if (sd && menqing) add('不求人', 3);
    else { if (sd) add('自摸', 1); if (menqing) add('門清', 1); }
    if (!sd && melds.length === 5 && melds.every(m => m.t !== 'a')) add('全求人', 2);
    // 花
    if (fl.length === 8) add('八仙過海', 8);
    else {
      for (const base of [34, 38]) {
        const have = [0, 1, 2, 3].filter(k => fl.includes(base + k));
        if (have.length === 4) add(base === 34 ? '春夏秋冬' : '梅蘭竹菊', 2);
        else if (fl.includes(base + seatW)) add('正花 ' + tileName(base + seatW), 1);
      }
    }
    const pungs = groups.filter(g => g.k === 'p').map(g => g.t);
    const dp = pungs.filter(t => t >= 31).length, wp = pungs.filter(t => t >= 27 && t <= 30).length;
    if (dp === 3) add('大三元', 8);
    else if (dp === 2 && d.pair >= 31) add('小三元', 4);
    else for (const t of pungs) if (t >= 31) add('三元牌 ' + tileName(t), 1);
    if (wp === 4) add('大四喜', 16);
    else if (wp === 3 && d.pair >= 27 && d.pair <= 30) add('小四喜', 8);
    else {
      if (pungs.includes(27 + roundW)) add('圈風 ' + WINDS[roundW], 1);
      if (pungs.includes(27 + seatW)) add('門風 ' + WINDS[seatW], 1);
    }
    if (suits.size === 0) add('字一色', 16);
    else if (suits.size === 1 && !honors) add('清一色', 8);
    else if (suits.size === 1) add('混一色', 4);
    if (pungs.length === 5) add('碰碰胡', 4);
    const allChow = groups.every(g => g.k === 'c');
    const ping = allChow && d.pair < 27 && fl.length === 0 && !sd && !single;
    if (ping) add('平胡', 2);
    if (anke === 3) add('三暗刻', 2); else if (anke === 4) add('四暗刻', 5); else if (anke >= 5) add('五暗刻', 8);
    if (single) add('獨聽', 1);
    if (ctx.last && sd) add('海底撈月', 1);
    if (ctx.last && !sd) add('河底撈魚', 1);
    if (ctx.kong && sd) add('槓上開花', 1);
    if (ctx.rob) add('搶槓', 1);
    const tai = it.reduce((a, b) => a + b[1], 0);
    if (!best || tai > best.tai) best = { tai, it };
  }
  return best || { tai: 0, it: [] };
}

/* ---------- 兩人麻將台數（依 mahjongtw.com 兩人台麻規則） ---------- */
function score2(G, s, win, sd, ctx) {
  const hand = G.hands[s].slice(); if (!sd) hand.push(win);
  const melds = G.melds[s], fl = G.flowers[s];
  const before = hand.slice(); removeOne(before, win);
  const single = waits(before, melds).length === 1;
  const menqing = melds.every(m => m.t === 'a');
  const allTiles = hand.concat(...melds.map(m => m.x));
  const honors = allTiles.some(t => t >= 27), chars = allTiles.some(t => t < 9);
  let best = null;
  for (const d of decomps(cnt(hand))) {
    const groups = d.g.map(g => ({ k: g.k, t: g.t })).concat(melds.map(m => ({ k: m.t === 'c' ? 'c' : 'p', t: Math.min(...m.x) })));
    let anke = d.g.filter(g => g.k === 'p').length + melds.filter(m => m.t === 'a').length;
    if (!sd) {
      const inPair = d.pair === win, inChow = d.g.some(g => g.k === 'c' && win >= g.t && win <= g.t + 2);
      if (!inPair && !inChow) anke--;
    }
    const it = []; const add = (n, v) => it.push([n, v]);
    if (sd && menqing) add('不求人', 4);
    else { if (sd) add('自摸', 1); if (menqing) add('門清', 1); }
    if (!sd && melds.length === 5 && melds.every(m => m.t !== 'a')) add('全求人', 6);
    if (single) add('獨聽', 1);
    const pungs = groups.filter(g => g.k === 'p').map(g => g.t);
    const allChow = groups.every(g => g.k === 'c');
    if (allChow && !honors && !single) add('平胡', 2);
    if (pungs.length === 5) add('碰碰胡', 6);
    if (anke >= 4) add('四暗刻', 64); else if (anke === 3) add('三暗刻', 16); else if (anke === 2) add('二暗刻', 2);
    if (!chars) add('字一色', 64);
    else if (!honors) add('清一色', 24);
    else add('混一色', 6);
    if (!honors && allTiles.every(t => t % 9 >= 5)) add('全大（六～九）', 12);
    if (!honors && allTiles.every(t => t % 9 <= 3)) add('全小（一～四）', 12);
    const dp = pungs.filter(t => t >= 31).length, wp = pungs.filter(t => t >= 27 && t <= 30).length;
    if (dp === 3) add('大三元', 88);
    else if (dp === 2 && d.pair >= 31) add('小三元', 64);
    else for (const t of pungs) if (t >= 31) add('三元牌 ' + tileName(t), 1);
    if (wp === 4) add('大四喜', 64);
    else if (wp === 3 && d.pair >= 27 && d.pair <= 30) add('小四喜', 64);
    if (fl.length === 8) add('八仙過海', 8);
    else for (const base of [34, 38]) if ([0, 1, 2, 3].every(k => fl.includes(base + k))) add(base === 34 ? '春夏秋冬' : '梅蘭竹菊', 2);
    if (ctx.last && sd) add('海底撈月', 8);
    if (ctx.last && !sd) add('河底撈魚', 8);
    if (ctx.kong && sd) add('槓上開花', 1);
    if (ctx.rob) add('搶槓', 1);
    const tai = it.reduce((a, b) => a + b[1], 0);
    if (!best || tai > best.tai) best = { tai, it };
  }
  return best || { tai: 0, it: [] };
}

/* ---------- game flow ---------- */
function removedTile(G, t) { // 兩人麻將：拿掉筒子和條子，只用萬子＋字牌
  return G.mode === 2 && t >= 9 && t < 27;
}
function deadOf(G) { return G.mode === 2 ? 0 : DEAD; } // 兩人麻將牌少，不留尾
function newGame(o) {
  const active = o.mode === 2 ? [0, 2] : [0, 1, 2, 3];
  return {
    mode: o.mode, fl: o.fl !== false, B: o.B, P: o.P, active, seats: [null, null, null, null],
    dealer: 0, streak: 0, wind: 0, handNo: 0, ph: 'lobby', wall: [], hands: [[], [], [], []],
    melds: [[], [], [], []], flowers: [[], [], [], []], disc: [[], [], [], []],
    turn: 0, drawn: false, lastDraw: null, lastDisc: null, claim: null, result: null,
    lg: '', deadline: 0, phaseAt: 0, botAt: 0, first: false, kong: false,

/* ---------- 線上連線（PeerJS 點對點，房主的瀏覽器就是伺服器） ---------- */

const peerOpts = () => Object.assign({ debug: 1 }, window.PEER_OPTS || {});

  net = null;
}
// 房主送出最新牌局給每個朋友；朋友送出自己的暱稱和動作
function setPresence() {
  if (role === 'h' && net && net.conns) {

/* 房主開房：用房號當連線代號，被別人用走就換一個 */
function hostNet(tries = 0, keepCode = false) {
  netClose(); netErr = '';
  if (typeof Peer !== 'function') { netErr = '連線元件載入失敗，請檢查網路後重新整理'; render(); return; }
  const me = { conns: new Map(), closed: false };
  net = me;
  const peer = new Peer(PEER_PREFIX + code, peerOpts());
  me.peer = peer;
  peer.on('open', () => { if (net !== me) return; me.ready = true; netErr = ''; render(); });
  peer.on('connection', conn => {
    conn.on('open', () => { me.conns.set(conn.peer, { conn, p: null }); try { conn.send({ type: 'st', st: pub, code }); } catch (e) {} });
    conn.on('data', d => {
      if (net !== me || !d || typeof d !== 'object') return;
      if (d.type === 'p' && d.p && typeof d.p === 'object') {
        const c = me.conns.get(conn.peer) || { conn }; c.p = d.p; me.conns.set(conn.peer, c); hostSync();
      }
    });
    const gone = () => { if (net !== me) return; me.conns.delete(conn.peer); hostSync(); };
    conn.on('close', gone); conn.on('error', gone);

  peer.on('error', err => {
    if (net !== me) return;
    if (err.type === 'unavailable-id') {

      if (!keepCode && tries < 5) { code = randCode(); commit(); hostNet(tries + 1); return; }

      netErr = '連線伺服器暫時連不上，正在重試…';
      me.timer = setTimeout(() => { if (net === me) hostNet(0, true); }, 4000); render(); return;
    }
    console.warn('peer', err.type, err);
  });
}

/* 朋友加入：連到房主 */
function guestNet() {

  const me = { closed: false };
  net = me;
  const peer = new Peer(peerOpts());
  me.peer = peer;
  const retry = ms => { if (net === me && role === 'g') me.timer = setTimeout(() => { if (net === me && role === 'g') connectHost(); }, ms); };
  const connectHost = () => {
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    me.conn = conn;
    conn.on('open', () => { if (net !== me) return; hostMissing = false; setPresence(); });
    conn.on('data', d => {
      if (net !== me || !d || d.type !== 'st' || !d.st) return;

    conn.on('close', () => { if (net !== me) return; hostMissing = true; render(); retry(3000); });
  };
  peer.on('open', connectHost);
  peer.on('disconnected', () => { if (net === me && !me.closed) setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on('error', err => {
    if (net !== me) return;

    if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed') {
      netErr = '連線伺服器暫時連不上，正在重試…'; render(); me.timer = setTimeout(() => { if (net === me) guestNet(); }, 4000); return;
    }

}
function hostSync() {

  if (G.ph === 'lobby') {
    for (const s of G.active) { const x = G.seats[s]; if (x && !x.bot && x.cid !== cid && !online.has(x.cid)) { G.seats[s] = null; changed = true; } }

      const free = G.active.find(s => !G.seats[s]);
      if (free !== undefined) { G.seats[free] = { cid: pc, nick: cleanNick(p.presence.nick), bot: false, score: 0, q: 0 }; changed = true; }
    }
  }
  for (const p of peers) {
    const s = G.seats.findIndex(x => x && x.cid === p.presence.cid);
    if (s < 0) continue;

}

      <span class="wind ${me === st.dl ? 'dl' : ''}">${WINDS[windIdx(st, me)]}</span>${me === st.dl ? `<span class="zhuang">莊</span>` : ''}
      <span class="cell"><span class="nm">${esc(mx.n)}</span>${spectator ? '（旁觀）' : ''}${mx.tg && !ended ? ' <span class="tingbadge">聽</span>' : ''}</span>
      ${me === st.dl && st.sk ? `<span class="cell">連${st.sk}拉${st.sk}</span>` : ''}
      <span class="cell">分數 <span class="sc">${mx.sc > 0 ? '+' : ''}${mx.sc}</span></span>
      <span class="cell">剩 ${st.wl} 張</span>
    </div>
    ${spectator ? '' : `<div class="myclock">${alarm(me)}</div>`}
  </div>
  ${ended && !showBanner ? resultHTML(st) : ''}`;
  app.style.setProperty('--u', units.toFixed(2));
  app.style.setProperty('--pp', '-' + (now % 1600) + 'ms');
  tick();
}

function resultHTML(st) {
  const r = st.rs; if (!r) return '';
  if (resultHidden) return `<button class="btn peek" data-a="showres">看結果</button>`;
  const S = st.S, act = st.md === 2 ? [0, 2] : [0, 1, 2, 3];
  const isHost = role === 'h' || role === 'solo';
  let body;
  if (r.w < 0) body = `<h3>流局</h3><div class="note">牌摸完了沒人胡，莊家 ${esc(S[st.dl].n)} 連莊。</div>`;
  else {
    const w = S[r.w];
    const hand = dec(w.h); removeOne(hand, r.t);
    body = `<h3>${r.sd ? '自摸' : '胡牌'}</h3>
      <div><b>${esc(w.n)}</b> ${r.sd ? '自摸' : `胡 ${esc(S[r.fr].n)} 打的`} ${tileName(r.t)}</div>
      <div class="winhand">${meldsHTML(w.m, true)}<span class="tiles">${sortT(hand).map(t => T(t)).join('')}</span>${T(r.t, 'hl')}</div>
      ${w.f ? `<div class="winhand">${dec(w.f).map(t => T(t)).join('')}</div>` : ''}
      <div class="items">${r.it.map(([n, v]) => `<span>${esc(n)}</span><span class="n">${v} 台</span>`).join('')}
        ${r.dt ? `<span>莊家${st.sk ? `（連${st.sk}拉${st.sk}）` : ''}<span class="muted"> · 只算莊家那家</span></span><span class="n">${r.dt} 台</span>` : ''}
        <span class="tot">合計</span><span class="n tot">${r.tai} 台${r.dt ? ` + 莊 ${r.dt}` : ''}</span></div>`;
  }
  // 準備：電腦、斷線的人、房主自己都算已準備
  const rd = st.rd || [0, 0, 0, 0];
  const isReady = s => !!(S[s].b || !S[s].o || rd[s] || s === st.hs || role === 'solo');
  const nReady = act.filter(isReady).length, allReady = nReady === act.length;
  const me = mySeat();
  const waited = Date.now() - (st.ea || 0);
  if (isHost && !allReady && waited < 20000) setTimeout(render, 20000 - waited + 50);
  const pays = `<div class="pays">${act.map(s => `<span>${esc(S[s].n)}${s === me ? '（你）' : ''}</span>
     <span class="${r.pay[s] > 0 ? 'pos' : r.pay[s] < 0 ? 'neg' : ''}">${r.pay[s] > 0 ? '+' : ''}${r.pay[s]}</span>
     <span class="muted">總 ${S[s].sc}</span>
     <span class="rdy ${isReady(s) ? 'ok' : ''}">${s === st.hs && role !== 'solo' ? '房主' : isReady(s) ? '✓ 準備' : '準備中…'}</span>`).join('')}</div>`;
  let ctrl;
  if (isHost) {
    ctrl = allReady || role === 'solo' ? `<button class="btn" data-a="next">下一局</button>`
      : waited > 20000 ? `<button class="btn" data-a="next">不等了，直接開下一局</button>`
      : `<button class="btn" disabled>等朋友準備（${nReady}/${act.length}）</button>`;
  } else if (me >= 0 && !rd[me]) {
    ctrl = `<button class="btn ready" data-a="ready" ${pending() ? 'disabled' : ''}>準備</button>`;
  } else {
    ctrl = `<span class="note">${me >= 0 ? '已準備，' : ''}等房主開下一局…</span>`;
  }
  const ra = animT('res' + st.hn, 900);
  return `<div class="ov ${ra >= 0 ? 'enter' : ''}" style="--ae:-${Math.max(0, ra)}ms"><div class="card"><div class="cl">${body}</div><div class="cr">${pays}
    <div class="row">${ctrl}
    <button class="btn ghost" data-a="hideres">看牌桌</button></div></div></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  if (e.target.id === 'nick' || e.target.id === 'nick2') { nick = e.target.value; LS.set('mj_nick', nick); }
  if (e.target.id === 'b') newB = Math.max(0, Math.min(100000, parseInt(e.target.value) || 0));
  if (e.target.id === 'p') newP = Math.max(0, Math.min(100000, parseInt(e.target.value) || 0));
});
document.addEventListener('change', e => {
  if (e.target.id === 'nick' || e.target.id === 'nick2') {
    if (role === 'h' && G) { const s = G.seats.findIndex(x => x && x.cid === cid); if (s >= 0) { G.seats[s].nick = myNick(); commit(); } }
    else setPresence();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'jc') guestJoin(e.target.value); });
document.addEventListener('click', e => {
  const tile = e.target.closest('.hand .t');
  if (tile && pub && pub.ph === 'act' && pub.tn === mySeat() && !pending()) {
    const t = +tile.dataset.t;
    if (pub.S[mySeat()].tg) return;
    if (tingSel) { if (tile.classList.contains('tingok')) { tingSel = false; doAct({ k: 't', t }); } return; }
    if (sel === t) doAct({ k: 'd', t }); else { sel = t; render(); }
    return;
  }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a !== 'leave') confirmLeave = false;
  switch (a) {
    case 'mode4': newMode = 4; return render();
    case 'mode2': newMode = 2; return render();
    case 'fl1': newFl = true; return render();
    case 'fl0': newFl = false; return render();
    case 'create': return hostCreate();
    case 'solo': return soloStart();
    case 'resume': return hostResume();
    case 'rejoin': return guestJoin(LS.get('mj_guest'));
    case 'join': return guestJoin($('#jc').value);
    case 'jointo': return guestJoin(b.dataset.c);
    case 'leave': if (!confirmLeave) { confirmLeave = true; return render(); } return leave();
    case 'copylink': case 'sharelink': {
      const link = shareLink(), text = `來打台麻！房號 ${code}`;
      if (a === 'sharelink' && navigator.share) { navigator.share({ title: '台麻十六張', text, url: link }).catch(() => {}); return; }
      const done = () => { b.textContent = '已複製'; };
      const fallback = () => { const el = $('#linkbox'); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } b.textContent = '請長按連結複製'; };
      try { navigator.clipboard.writeText(link).then(done, fallback); } catch (err) { fallback(); }
      return;
    }
    case 'addbot': { const s = +b.dataset.s; if (G && G.ph === 'lobby' && !G.seats[s]) { const used = G.seats.filter(x => x && x.bot).length; G.seats[s] = { cid: 'bot' + s, nick: '電腦' + 'ABC'[used], bot: true, score: 0 }; commit(); } return; }
    case 'rmbot': { const s = +b.dataset.s; if (G && G.ph === 'lobby' && G.seats[s] && G.seats[s].bot) { G.seats[s] = null; commit(); hostSync(); } return; }
    case 'start': if (G && G.ph === 'lobby' && G.active.every(s => G.seats[s])) { startHand(G); commit(); } return;
    case 'next': if (G && G.ph === 'end') { nextHand(G); resultHidden = false; commit(); } return;
    case 'ready': return doAct({ k: 'y' });
    case 'hideres': resultHidden = true; return render();
    case 'showres': resultHidden = false; return render();
    case 'r': return doAct({ k: 'r' });
    case 'tingon': tingSel = true; sel = null; return render();
    case 'tingoff': tingSel = false; return render();
    case 'z': return doAct({ k: 'z' });
    case 'd': return doAct({ k: 'd', t: +b.dataset.t });
    case 'g': return doAct({ k: 'g', t: +b.dataset.t });
    case 'h': case 'p': case 'k': case 'x': return doAct({ k: a });
    case 'c': return doAct({ k: 'c', s: +b.dataset.s });
  }
});

render();
initRoom();
</script>
</body>
</html>
